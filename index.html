<!DOCTYPE html>
<html>
<head>
    <title>Securly Classroom - Class session is active</title>
    <link rel="icon" type="image/png" href="secure.png">
    <style>
        body, html { 
            background-color: black; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }
        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
    </style>
    <script>
        document.addEventListener('keydown', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            }
        });
    </script>
</head>
<body>

    <!-- Fullscreen Background Video -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="hellowhere.mp4" type="video/mp4">
    </video>

    <!-- Hidden Overlay Panel -->
    <div id="secret-pong-wrapper" style="
        display: none; 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        z-index: 2; 
        pointer-events: none; 
        font-family: monospace; 
        color: #fff;
    ">
        <!-- Floating Score Board Overlay -->
        <div style="position: absolute; width: 100%; top: 40px; display: flex; justify-content: space-around; font-size: 48px; font-weight: bold; pointer-events: none; opacity: 0.8; text-shadow: 0 2px 4px rgba(0,0,0,0.6);">
            <div id="pong-p1-score">0</div>
            <div id="pong-p2-score">0</div>
        </div>

        <!-- Full-Window Transparent Game Canvas -->
        <canvas id="pongCanvas" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%;
            display: block; 
            cursor: none;
            pointer-events: auto; 
        "></canvas>
    </div>

    <script>
    (function() {
        const activeKeys = new Set();
        const targetKeys = ['w', 'a', 's', 'd'];
        let gameActive = false;
        let animationFrameId = null;

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (targetKeys.includes(key)) {
                activeKeys.add(key);
                if (activeKeys.size === 4 && targetKeys.every(k => activeKeys.has(k))) {
                    toggleSecretPong();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            activeKeys.delete(e.key.toLowerCase());
        });

        window.addEventListener('blur', () => { 
            activeKeys.clear(); 
        });

        function toggleSecretPong() {
            const wrapper = document.getElementById('secret-pong-wrapper');
            gameActive = !gameActive;
            if (gameActive) {
                wrapper.style.display = 'block';
                initPong();
            } else {
                wrapper.style.display = 'none';
                cancelAnimationFrame(animationFrameId);
            }
        }

        function initPong() {
            const canvas = document.getElementById('pongCanvas');
            const ctx = canvas.getContext('2d');
            const score1Display = document.getElementById('pong-p1-score');
            const score2Display = document.getElementById('pong-p2-score');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // CHANGED: Paddle width reduced from 12 to 6 for a thinner profile
            const paddleWidth = 6;
            const paddleHeight = window.innerHeight * 0.18; 
            const ballRadius = 8;
            let p1Score = 0;
            let p2Score = 0;

            const player = {
                x: 25, 
                y: canvas.height / 2 - paddleHeight / 2,
                width: paddleWidth,
                height: paddleHeight,
                score: 0
            };

            const ai = {
                x: canvas.width - 25 - paddleWidth, 
                y: canvas.height / 2 - paddleHeight / 2,
                width: paddleWidth,
                height: paddleHeight,
                score: 0,
                speed: 6.5 
            };

            const ball = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: ballRadius,
                speed: 7,
                velocityX: 7,
                velocityY: 7
            };

            window.addEventListener('resize', () => {
                if (!gameActive) return;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ai.x = canvas.width - 25 - paddleWidth;
                player.height = canvas.height * 0.18;
                ai.height = canvas.height * 0.18;
            });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const root = document.documentElement;
                const mouseY = e.clientY - rect.top - root.scrollTop;
                player.y = mouseY - player.height / 2;
            });

            canvas.addEventListener('touchmove', (e) => {
                if(e.touches.length > 0) {
                    const rect = canvas.getBoundingClientRect();
                    const touchY = e.touches.clientY - rect.top;
                    player.y = touchY - player.height / 2;
                    e.preventDefault();
                }
            }, { passive: false });

            function resetBall() {
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.velocityX = -ball.velocityX; 
                ball.speed = 7; 
            }

            function collision(b, p) {
                return b.x + b.radius > p.x && b.x - b.radius < p.x + p.width &&
                       b.y + b.radius > p.y && b.y - b.radius < p.y + p.height;
            }

            function update() {
                ball.x += ball.velocityX;
                ball.y += ball.velocityY;

                if (player.y < 0) player.y = 0;
                if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;

                const aiTarget = ball.y - (ai.height / 2);
                ai.y += (aiTarget - ai.y) * 0.11; 

                if (ai.y < 0) ai.y = 0;
                if (ai.y > canvas.height - ai.height) ai.y = canvas.height - ai.height;

                if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                    ball.velocityY = -ball.velocityY;
                }

                let currentPaddle = (ball.x < canvas.width / 2) ? player : ai;

                if (collision(ball, currentPaddle)) {
                    let collidePoint = (ball.y - (currentPaddle.y + currentPaddle.height/2));
                    collidePoint = collidePoint / (currentPaddle.height/2);
                    let angleRad = (Math.PI/4) * collidePoint;
                    let direction = (ball.x < canvas.width / 2) ? 1 : -1;
                    ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                    ball.velocityY = ball.speed * Math.sin(angleRad);
                    ball.speed += 0.5; 
                }

                if (ball.x - ball.radius < 0) {
                    p2Score++;
                    score2Display.innerText = p2Score;
                    resetBall();
                } else if (ball.x + ball.radius > canvas.width) {
                    p1Score++;
                    score1Display.innerText = p1Score;
                    resetBall();
                }
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Fullscreen center dividing line
                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 2;
                ctx.setLineDash();
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]); 

                // CHANGED: Left paddle (Slightly darker red)
                ctx.fillStyle = "rgba(180, 20, 20, 0.85)";
                ctx.fillRect(player.x, player.y, player.width, player.height);

                // CHANGED: Right paddle (Very dark red)
                ctx.fillStyle = "rgba(90, 10, 10, 0.85)";
                ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

                // Game ball
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2, true);
                ctx.closePath();
                ctx.fill();
            }

            function gameLoop() {
                if (!gameActive) return;
                update();
                render();
                animationFrameId = requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }
    })();
    </script>
</body>
</html>
